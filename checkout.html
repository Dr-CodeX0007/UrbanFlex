<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | UrbanFlex</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header>

    <div class="container navbar">

        <div class="logo">
            Urban<span>Flex</span>
        </div>

        <button onclick="history.back()" id="cartButton">
            ← Back
        </button>

    </div>

</header>

<main class="container">

    <div class="checkout-container">

        <div class="checkout-form">

            <h2>Customer Details</h2>

            <input type="text" id="name" placeholder="Full Name" required>

            <input type="tel" id="phone" placeholder="Phone Number" required>

            <input type="email" id="email" placeholder="Email (Optional)">

            <textarea id="address" placeholder="Full Address" required></textarea>

            <input type="text" id="city" placeholder="City (auto-filled, editable)">
            <input type="text" id="area" placeholder="Area / Locality (auto-filled, editable)">

            <div class="state-select-wrapper">
    <select id="state" class="premium-select" required>
        <option value="">Select State</option>
        <!-- baaki saare options same rahenge -->
    </select>
    <span class="select-arrow">⌄</span>
</div>
    <option value="">Select State</option>
    <option>Andhra Pradesh</option>
    <option>Arunachal Pradesh</option>
    <option>Assam</option>
    <option>Bihar</option>
    <option>Chhattisgarh</option>
    <option>Goa</option>
    <option>Gujarat</option>
    <option>Haryana</option>
    <option>Himachal Pradesh</option>
    <option>Jharkhand</option>
    <option>Karnataka</option>
    <option>Kerala</option>
    <option>Madhya Pradesh</option>
    <option>Maharashtra</option>
    <option>Manipur</option>
    <option>Meghalaya</option>
    <option>Mizoram</option>
    <option>Nagaland</option>
    <option>Odisha</option>
    <option>Punjab</option>
    <option>Rajasthan</option>
    <option>Sikkim</option>
    <option>Tamil Nadu</option>
    <option>Telangana</option>
    <option>Tripura</option>
    <option>Uttar Pradesh</option>
    <option>Uttarakhand</option>
    <option>West Bengal</option>
    <option>Delhi</option>
    <option>Jammu and Kashmir</option>
    <option>Ladakh</option>
    <option>Puducherry</option>
</select>

            <input type="text" id="pincode" placeholder="Pincode" required>

        </div>

        <div class="order-summary">

            <h2>Order Summary</h2>

            <div id="orderSummary"></div>

            <button id="payButton">

                Proceed To Payment

            </button>

        </div>

    </div>

</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/checkout.js"></script>

</body>

</html>
