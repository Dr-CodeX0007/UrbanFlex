<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | UrbanFlex</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/account.css">
</head>
<body>

<header>
    <div class="container navbar">
        <a href="index.html" class="logo">Urban<span>Flex</span></a>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Products..." onkeydown="if(event.key==='Enter'){window.location.href='index.html'}">
        </div>

        <div class="nav-right">
            <button id="navAuthBtn" class="nav-auth-btn"></button>
            <button id="cartButton" onclick="location.href='cart.html'">
                🛒 Cart (<span id="cartCount">0</span>)
            </button>
        </div>
    </div>
</header>

<div class="account-page">

    <div class="account-header">
        <div class="account-avatar">
            <div class="avatar-circle" id="avatarInitial">U</div>
            <div>
                <h2 id="accountName">Loading...</h2>
                <p id="accountEmail"></p>
            </div>
        </div>
        <button class="logout-link-btn" onclick="logoutCustomer()">Log Out</button>
    </div>

    <div class="quick-links-grid">
        <a href="index.html" class="quick-link-card">
            <div class="icon">🏠</div>
            <span>Home</span>
        </a>
        <a href="about.html" class="quick-link-card">
            <div class="icon">ℹ️</div>
            <span>About</span>
        </a>
        <a href="contact.html" class="quick-link-card">
            <div class="icon">📞</div>
            <span>Contact</span>
        </a>
        <a href="faq.html" class="quick-link-card">
            <div class="icon">❓</div>
            <span>FAQ</span>
        </a>
    </div>

    <div class="orders-section">
        <h3>My Orders</h3>
        <div id="ordersList">
            <p class="order-empty">Order history coming soon.</p>
        </div>
    </div>

</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/customerAuth.js"></script>
<script>
    // Guard: only logged-in customers can view this page
    if (!getCustomerToken()) {
        window.location.href = "login.html";
    }

    const customer = getCustomerData();

    if (customer) {
        document.getElementById("accountName").innerText = customer.name;
        document.getElementById("accountEmail").innerText = customer.email;
        document.getElementById("avatarInitial").innerText = customer.name.charAt(0).toUpperCase();
    }

    function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const count = cart.reduce((total, item) => total + (Number(item.quantity) || 0), 0);
        const cartCount = document.getElementById("cartCount");
        if (cartCount) cartCount.textContent = count;
    }

    updateCartCount();
    window.addEventListener("pageshow", updateCartCount);
    window.addEventListener("storage", updateCartCount) ;

    // ---------- Load order history ----------
    async function loadMyOrders() {
        const ordersList = document.getElementById("ordersList");

        try {
            const res = await fetch(`${API_BASE_URL}/api/orders/my-orders`, {
                headers: customerAuthHeaders()
            });

            if (!res.ok) {
                ordersList.innerHTML = `<p class="order-empty">Unable to load orders right now.</p>`;
                return;
            }

            const orders = await res.json();

            if (orders.length === 0) {
                ordersList.innerHTML = `
                    <div class="empty-orders">
                        <div class="empty-orders-icon">📦</div>
                        <h3>No orders yet</h3>
                        <p>When you place an order, it'll show up here.</p>
                        <button class="buy-btn" onclick="location.href='index.html'">Start Shopping</button>
                    </div>
                `;
                return;
            }

            ordersList.innerHTML = orders.map(order => `
                <div class="order-history-card">
                    <div class="order-history-top">
                        <div>
                            <strong>${order.product}</strong>
                            <p class="order-history-date">${order.orderDate}</p>
                        </div>
                        <span class="order-status-tag status-${order.orderStatus.toLowerCase().replace(/\s+/g, "-")}">${order.orderStatus}</span>
                    </div>
                    <div class="order-history-bottom">
                        <span>Qty: ${order.quantity}</span>
                        <span>₹${order.total}</span>
                    </div>
                </div>
            `).join("");
        } catch (error) {
            console.error(error);
            ordersList.innerHTML = `<p class="order-empty">Unable to load orders right now.</p>`;
        }
    }

    loadMyOrders();
</script>

</body>
</html>
