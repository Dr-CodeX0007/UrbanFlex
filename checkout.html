<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | UrbanFlex</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header>

    <div class="container navbar">

        <div class="logo">
            Urban<span>Flex</span>
        </div>

        <button onclick="history.back()" id="cartButton">
            ← Back
        </button>

    </div>

</header>

<main class="container">

    <div class="checkout-container">

        <div class="checkout-form">

            <h2>Customer Details</h2>

            <input type="text" id="name" placeholder="Full Name" required>

            <input type="tel" id="phone" placeholder="Phone Number" required>

            <input type="email" id="email" placeholder="Email (Optional)">

            <textarea id="address" placeholder="Full Address" required></textarea>

            <input type="text" id="city" placeholder="City (auto-filled, editable)">
            <input type="text" id="area" placeholder="Area / Locality (auto-filled, editable)">

            <select id="state" class="premium-select" required>
    <option value="">Select State</option>
    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="Uttarakhand">Uttarakhand</option>
    <option value="West Bengal">West Bengal</option>
    <option value="Delhi">Delhi</option>
    <option value="Jammu and Kashmir">Jammu and Kashmir</option>
    <option value="Ladakh">Ladakh</option>
    <option value="Puducherry">Puducherry</option>
</select>
    

            <input type="text" id="pincode" placeholder="Pincode" required>

        </div>

        <div class="order-summary">

            <h2>Order Summary</h2>

            <div id="orderSummary"></div>

            <button id="payButton">

                Proceed To Payment

            </button>

        </div>

    </div>

</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/checkout.js"></script>

</body>

</html>
